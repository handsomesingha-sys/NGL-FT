    function editorPhotoKey(photo) {
      return photo.photoId
        ? String(photo.photoId)
        : String(photo.clientId);
    }

    function bindAlbumEditorEvents() {
      const editor = state.editor;
      if (!editor) return;

      $('#cancel-album-editor').addEventListener(
        'click',
        closeAlbumEditor
      );

      $('#save-album-editor').addEventListener(
        'click',
        saveAlbumEditor
      );

      $('#album-editor-form').addEventListener('submit', function (event) {
        event.preventDefault();
        saveAlbumEditor();
      });

      $('#editor-album-category').addEventListener(
        'change',
        updateCategoryDetails
      );

      const fileInput = $('#editor-photo-files');
      const dropzone = $('#editor-file-dropzone');

      fileInput.addEventListener('change', function () {
        addFilesToAlbumEditor(Array.from(fileInput.files || []));
        fileInput.value = '';
      });

      dropzone.addEventListener('dragover', function (event) {
        event.preventDefault();
        dropzone.style.borderColor = 'var(--primary)';
      });

      dropzone.addEventListener('dragleave', function () {
        dropzone.style.borderColor = '';
      });

      dropzone.addEventListener('drop', function (event) {
        event.preventDefault();
        dropzone.style.borderColor = '';

        addFilesToAlbumEditor(
          Array.from(event.dataTransfer.files || [])
            .filter(file => file.type.startsWith('image/'))
        );
      });

      $('#editor-toggle-selection').addEventListener('click', function () {
        editor.selectionMode = !editor.selectionMode;

        if (!editor.selectionMode) {
          editor.selectedPhotoIds.clear();
        }

        renderEditorPhotos();
      });

      $('#editor-finish-selection').addEventListener('click', function () {
        editor.selectionMode = false;
        editor.selectedPhotoIds.clear();
        renderEditorPhotos();
      });

      $('#editor-duplicate-selected').addEventListener(
        'click',
        duplicateSelectedEditorPhotos
      );

      $('#editor-delete-selected').addEventListener(
        'click',
        deleteSelectedEditorPhotos
      );
    }

    function updateCategoryDetails() {
      const element = $('#editor-category-description');
      if (!element) return;

      const categoryId = $('#editor-album-category').value;

      if (!categoryId) {
        element.textContent = 'ไม่ได้กำหนดหมวดหมู่';
        return;
      }

      const category = state.categories.find(item =>
        String(item.categoryId) === String(categoryId)
      );

      element.textContent = category
        ? (category.description || 'ไม่มีข้อมูลรายละเอียด')
        : 'ไม่มีข้อมูลรายละเอียด';
    }

    function addFilesToAlbumEditor(files) {
      const editor = state.editor;
      if (!editor || !files || !files.length) return;

      const validFiles = [];

      for (const file of files) {
        if (!file.type || !file.type.startsWith('image/')) {
          showToast('ข้ามไฟล์ที่ไม่ใช่รูปภาพ: ' + file.name, 'error');
          continue;
        }

        if (file.size > CONFIG.MAX_IMAGE_BYTES) {
          showToast(
            'ไฟล์ ' + file.name + ' มีขนาดใหญ่เกินขีดจำกัด',
            'error'
          );
          continue;
        }

        validFiles.push(file);
      }

      if (!validFiles.length) return;

      if (
        editor.photos.length + validFiles.length >
        CONFIG.MAX_BATCH_FILES
      ) {
        showToast('ชุดอัปโหลดนี้มีจำนวนรูปภาพมากเกินไป', 'error');
        return;
      }

      validFiles.forEach(function (file) {
        const previewUrl = URL.createObjectURL(file);
        editor.objectUrls.push(previewUrl);

        editor.photos.push({
          photoId: '',
          clientId: makeRandomHex(10),
          albumId: editor.albumId,
          imageUrl: previewUrl,
          thumbnailUrl: previewUrl,
          previewUrl: previewUrl,
          deleteUrl: '',
          caption: '',
          sortOrder: editor.photos.length + 1,
          duplicateOfPhotoId: '',
          pendingFile: file,
          isNew: true
        });
      });

      renderEditorPhotos();

      showToast(
        'เพิ่มรูปภาพ ' + validFiles.length + ' รูปลงในรายการแล้ว',
        'success'
      );
    }

    function renderEditorPhotos() {
      const editor = state.editor;
      if (!editor) return;

      const grid = $('#editor-image-grid');
      if (!grid) return;

      grid.classList.toggle(
        'selection-mode',
        Boolean(editor.selectionMode)
      );

      $('#editor-toggle-selection').innerHTML = editor.selectionMode
        ? '<i class="fa-solid fa-xmark"></i> ยกเลิกการเลือก'
        : '<i class="fa-regular fa-square-check"></i> เลือกรูปภาพ';

      $('#editor-photo-counter').textContent =
        formatNumber(editor.photos.length) + ' รูปภาพ';

      $('#editor-photo-empty').classList.toggle(
        'hidden',
        editor.photos.length > 0
      );

      if (!editor.photos.length) {
        grid.innerHTML = '';
      } else {
        grid.innerHTML = editor.photos.map(function (photo, index) {
          const key = editorPhotoKey(photo);
          const selected = editor.selectedPhotoIds.has(key);
          const imageSrc = photo.previewUrl ||
            photo.thumbnailUrl ||
            photo.imageUrl;

          return (
            '<div class="editor-photo ' +
              (selected ? 'selected' : '') +
              '" data-editor-photo="' + esc(key) +
              '" draggable="true" tabindex="0" role="button" aria-label="รูปภาพลำดับที่ ' +
              (index + 1) + '">' +
              '<img src="' + esc(imageSrc) +
                '" alt="รูปภาพลำดับที่ ' + (index + 1) +
                '" loading="lazy">' +
              '<span class="photo-select-dot"><i class="fa-solid fa-check"></i></span>' +
              '<span class="photo-order">' + (index + 1) + '</span>' +
              (photo.pendingFile
                ? '<span class="photo-pending-label">รออัปโหลด</span>'
                : '') +
            '</div>'
          );
        }).join('');
      }

      const count = editor.selectedPhotoIds.size;

      $('#editor-selected-count').textContent =
        formatNumber(count) + ' รูป';

      $('#editor-photo-toolbar').classList.toggle(
        'hidden',
        !editor.selectionMode || count === 0
      );

      bindEditorPhotoEvents();
    }

    function bindEditorPhotoEvents() {
      const editor = state.editor;
      if (!editor) return;

      $$('[data-editor-photo]').forEach(function (tile) {
        const key = tile.dataset.editorPhoto;

        tile.addEventListener('click', function () {
          if (!state.editor) return;

          if (state.editor.selectionMode) {
            if (state.editor.selectedPhotoIds.has(key)) {
              state.editor.selectedPhotoIds.delete(key);
            } else {
              state.editor.selectedPhotoIds.add(key);
            }

            renderEditorPhotos();
            return;
          }

          const photo = state.editor.photos.find(item =>
            editorPhotoKey(item) === key
          );

          if (photo) {
            openImageViewer(
              photo.previewUrl || photo.imageUrl || photo.thumbnailUrl,
              photo.caption || ''
            );
          }
        });

        tile.addEventListener('keydown', function (event) {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            tile.click();
          }
        });

        tile.addEventListener('dragstart', function (event) {
          if (!state.editor) return;

          state.editor.draggedPhotoKey = key;
          tile.classList.add('dragging');

          if (event.dataTransfer) {
            event.dataTransfer.effectAllowed = 'move';
            event.dataTransfer.setData('text/plain', key);
          }
        });

        tile.addEventListener('dragend', function () {
          tile.classList.remove('dragging');

          if (state.editor) {
            state.editor.draggedPhotoKey = '';
          }

          $$('.editor-photo').forEach(item => {
            item.classList.remove('dragging');
          });
        });

        tile.addEventListener('dragover', function (event) {
          event.preventDefault();
        });

        tile.addEventListener('drop', function (event) {
          event.preventDefault();

          if (!state.editor) return;

          const sourceKey =
            state.editor.draggedPhotoKey ||
            (event.dataTransfer
              ? event.dataTransfer.getData('text/plain')
              : '');

          if (sourceKey && sourceKey !== key) {
            moveEditorPhoto(sourceKey, key);
          }
        });

        /*
         * การจัดเรียงด้วยการกดค้างแล้วลากบนอุปกรณ์สัมผัส
         */
        let longPressTimer = null;
        let touchDragActive = false;
        let targetKey = key;

        tile.addEventListener('pointerdown', function (event) {
          if (event.pointerType !== 'touch') return;

          touchDragActive = false;
          targetKey = key;

          longPressTimer = setTimeout(function () {
            touchDragActive = true;

            if (state.editor) {
              state.editor.draggedPhotoKey = key;
            }

            tile.classList.add('dragging');
          }, 500);
        });

        tile.addEventListener('pointermove', function (event) {
          if (event.pointerType !== 'touch') return;

          if (!touchDragActive) {
            if (longPressTimer && Math.abs(event.movementY) > 8) {
              clearTimeout(longPressTimer);
              longPressTimer = null;
            }

            return;
          }

          event.preventDefault();

          const under = document.elementFromPoint(
            event.clientX,
            event.clientY
          );

          const target = under && under.closest('[data-editor-photo]');

          if (target && target.dataset.editorPhoto) {
            targetKey = target.dataset.editorPhoto;
          }
        }, { passive: false });

        const finishPointer = function () {
          if (longPressTimer) {
            clearTimeout(longPressTimer);
            longPressTimer = null;
          }

          if (touchDragActive && state.editor) {
            const source = state.editor.draggedPhotoKey;

            if (source && targetKey && source !== targetKey) {
              moveEditorPhoto(source, targetKey);
            }

            state.editor.draggedPhotoKey = '';
          }

          touchDragActive = false;
          tile.classList.remove('dragging');
        };

        tile.addEventListener('pointerup', finishPointer);
        tile.addEventListener('pointercancel', finishPointer);
      });
    }

    function moveEditorPhoto(sourceKey, targetKey) {
      const editor = state.editor;
      if (!editor) return;

      const sourceIndex = editor.photos.findIndex(photo =>
        editorPhotoKey(photo) === sourceKey
      );

      const targetIndex = editor.photos.findIndex(photo =>
        editorPhotoKey(photo) === targetKey
      );

      if (
        sourceIndex < 0 ||
        targetIndex < 0 ||
        sourceIndex === targetIndex
      ) {
        return;
      }

      const moved = editor.photos.splice(sourceIndex, 1)[0];
      editor.photos.splice(targetIndex, 0, moved);

      editor.photos.forEach((photo, index) => {
        photo.sortOrder = index + 1;
      });

      renderEditorPhotos();
    }

    function getSelectedEditorPhotos() {
      const editor = state.editor;
      if (!editor) return [];

      return editor.photos.filter(photo =>
        editor.selectedPhotoIds.has(editorPhotoKey(photo))
      );
    }

    function duplicateSelectedEditorPhotos() {
      const editor = state.editor;
      if (!editor) return;

      const selected = getSelectedEditorPhotos();
      if (!selected.length) return;

      const insertions = selected.map(function (photo) {
        return {
          index: editor.photos.indexOf(photo),
          duplicate: Object.assign({}, photo, {
            photoId: '',
            clientId: makeRandomHex(10),
            duplicateOfPhotoId: photo.photoId || '',
            isNew: true,
            sortOrder: 0
          })
        };
      }).sort((a, b) => b.index - a.index);

      insertions.forEach(function (item) {
        if (item.index >= 0) {
          editor.photos.splice(item.index + 1, 0, item.duplicate);
        }
      });

      editor.photos.forEach((photo, index) => {
        photo.sortOrder = index + 1;
      });

      editor.selectedPhotoIds.clear();

      insertions.forEach(function (item) {
        editor.selectedPhotoIds.add(editorPhotoKey(item.duplicate));
      });

      renderEditorPhotos();

      showToast(
        'ทำซ้ำรูปภาพ ' + selected.length + ' รูปแล้ว',
        'success'
      );
    }

    async function deleteSelectedEditorPhotos() {
      const editor = state.editor;
      if (!editor) return;

      const selected = getSelectedEditorPhotos();
      if (!selected.length) return;

      const accepted = await askConfirm(
        'ลบรูปภาพ',
        'ต้องการลบรูปภาพที่เลือกจำนวน ' + selected.length + ' รูปใช่หรือไม่',
        'ลบรูปภาพ',
        'btn-danger'
      );

      if (!accepted || !state.editor) return;

      const keys = new Set(selected.map(editorPhotoKey));

      editor.photos = editor.photos.filter(photo =>
        !keys.has(editorPhotoKey(photo))
      );

      editor.selectedPhotoIds.clear();

      editor.photos.forEach((photo, index) => {
        photo.sortOrder = index + 1;
      });

      renderEditorPhotos();

      showToast(
        'นำรูปภาพที่เลือกออกจากรายการแล้ว กดยืนยันบันทึกอัลบั้มเพื่อบันทึกการเปลี่ยนแปลง',
        'success'
      );
    }

    function openImageViewer(url, caption) {

        showToast('ไม่พบ URL รูปภาพ', 'error');

      openModal({

    function closeAlbumEditor() {
      const editor = state.editor;

      if (editor) {
        (editor.objectUrls || []).forEach(url => {
          try {
            URL.revokeObjectURL(url);
          } catch (error) {
            /* ข้าม URL ที่ไม่ถูกต้อง */

    /* =========================================================
       14. FILE UPLOAD
       ========================================================= */

    /*
     * อ่านไฟล์ด้วย FileReader
     * Progress ของ FileReader เป็นความคืบหน้าการอ่านไฟล์จริง
     * ส่วนแถบอัปโหลดอัลบั้มด้านล่างจะแสดงจำนวนภาพที่ส่งสำเร็จจริง
     */
    function readFileAsDataUrl(file, onProgress) {
      return new Promise(function (resolve, reject) {
        const reader = new FileReader();

        reader.onprogress = function (event) {
          if (event.lengthComputable && typeof onProgress === 'function') {
            onProgress(event.loaded, event.total);
          }
        };

        reader.onload = function () {
          resolve(String(reader.result || ''));
        };

        reader.onerror = function () {
          reject(new Error('อ่านไฟล์ไม่สำเร็จ: ' + file.name));
        };

        reader.onabort = function () {
          reject(new Error('การอ่านไฟล์ถูกยกเลิก: ' + file.name));
        };

        reader.readAsDataURL(file);
      });
    }

    async function uploadImageFileDetailed(file, progressCallback) {
      if (!(file instanceof File)) {
        throw new Error('ไม่พบไฟล์รูปภาพ');
      }

      if (!file.type || !file.type.startsWith('image/')) {
        throw new Error('ไฟล์ที่เลือกไม่ใช่รูปภาพ');
      }

      if (file.size > CONFIG.MAX_IMAGE_BYTES) {
        throw new Error('ไฟล์ ' + file.name + ' มีขนาดใหญ่เกินไป');
      }

      const dataUrl = await readFileAsDataUrl(file, progressCallback);
      const separator = dataUrl.indexOf(',');

      if (separator < 0) {
        throw new Error('รูปแบบไฟล์ที่อ่านไม่ถูกต้อง');
      }

      const result = await callPost('uploadImage', {
        imageBase64: dataUrl.substring(separator + 1),
        fileName: file.name,
        mimeType: file.type
      });

      if (!result.image || !result.image.url) {
        throw new Error('บริการอัปโหลดไม่ส่ง URL รูปภาพกลับมา');
      }

      return result.image;
    }

    async function uploadImageFile(file, progressCallback) {
      const result = await uploadImageFileDetailed(
        file,
        progressCallback
      );

      return result.url;
    }

    function updateAlbumUploadProgress(
      status,
      percent,
      detail,
      complete
    ) {
      const wrap = $('#editor-upload-progress');
      if (!wrap) return;

      wrap.classList.remove('hidden');

      $('#editor-upload-status').textContent = status || '';

      $('#editor-upload-percent').textContent =
        Math.round(percent || 0) + '%';

      $('#editor-upload-bar').style.width =
        Math.max(0, Math.min(100, percent || 0)) + '%';

      $('#editor-upload-bar').classList.toggle(
        'complete',
        Boolean(complete)
      );

      $('#editor-upload-detail').textContent = detail || '';
    }

    async function saveAlbumEditor() {
      const editor = state.editor;
      if (!editor || editor.isSaving) return;

      const title = $('#editor-album-title').value.trim();
      const description = $('#editor-album-description').value.trim();
      const categoryId = $('#editor-album-category').value;
      const isPublished = $('#editor-album-published').checked;

      if (!title) {
        showToast('กรุณาระบุชื่ออัลบั้ม', 'error');
        $('#editor-album-title').focus();
        return;
      }

      const organizationId = isAdmin()
        ? $('#editor-organization').value
        : state.user.organizationId;

      if (!organizationId) {
        showToast('กรุณาเลือกหน่วยงานหรือองค์กร', 'error');
        return;
      }

      const button = $('#save-album-editor');
      editor.isSaving = true;

      setBusy(button, true, 'กำลังเตรียมอัปโหลด');

      const pendingPhotos = editor.photos.filter(photo =>
        photo.pendingFile instanceof File
      );

      const totalPending = pendingPhotos.length;
      let completed = 0;

      if (totalPending > 0) {
        updateAlbumUploadProgress(
          'กำลังอัปโหลดรูปภาพ',
          0,
          'อัปโหลดสำเร็จ 0 จาก ' + totalPending + ' รูป',
          false
        );
      }

      try {
        for (const photo of pendingPhotos) {
          const file = photo.pendingFile;

          updateAlbumUploadProgress(
            'กำลังอัปโหลด ' + file.name,
            totalPending ? (completed / totalPending) * 90 : 90,
            'อัปโหลดสำเร็จ ' + completed + ' จาก ' + totalPending + ' รูป',
            false
          );

          const uploaded = await uploadImageFileDetailed(
            file,
            function (loaded, total) {
              updateAlbumUploadProgress(
                'กำลังเตรียมไฟล์ ' + file.name,
                totalPending ? (completed / totalPending) * 90 : 90,
                'อ่านไฟล์แล้ว ' +
                  formatNumber(loaded) + ' / ' +
                  formatNumber(total) + ' ไบต์',
                false
              );
            }
          );

          photo.imageUrl = uploaded.url;
          photo.thumbnailUrl = uploaded.thumbnailUrl || uploaded.url;
          photo.previewUrl = uploaded.url;
          photo.deleteUrl = uploaded.deleteUrl || '';
          photo.pendingFile = null;

          completed++;

          updateAlbumUploadProgress(
            'อัปโหลดรูปภาพแล้ว',
            totalPending ? (completed / totalPending) * 90 : 90,
            'อัปโหลดสำเร็จ ' + completed + ' จาก ' + totalPending + ' รูป',
            false
          );

          renderEditorPhotos();
        }

        const finalPhotos = editor.photos.map(function (photo, index) {
          return {
            photoId: photo.photoId || '',
            imageUrl: photo.imageUrl,
            thumbnailUrl: photo.thumbnailUrl || photo.imageUrl,
            deleteUrl: photo.deleteUrl || '',
            caption: photo.caption || '',
            sortOrder: index + 1,
            duplicateOfPhotoId: photo.duplicateOfPhotoId || ''
          };
        });

        updateAlbumUploadProgress(
          'กำลังบันทึกข้อมูลอัลบั้ม',
          95,
          'กำลังบันทึกรายละเอียดและลำดับรูปภาพ',
          false
        );

        const action = editor.albumId
          ? 'updateAlbum'
          : 'createAlbum';

        const result = await callPost(action, {
          albumId: editor.albumId || '',
          title: title,

        );

    function clientPasswordStrength(password) {
      password = String(password || '');

      const checks = [
        password.length >= 10,
        /[a-z]/.test(password),
        /[A-Z]/.test(password),
        /[0-9]/.test(password),
        /[^A-Za-z0-9]/.test(password)
      ];

      const score = checks.filter(Boolean).length;

      let label = 'อ่อนมาก';

      if (score >= 5 && password.length >= 12) {
        label = 'แข็งแกร่งมาก';
      } else if (score >= 4 && password.length >= 10) {
        label = 'แข็งแกร่ง';
      } else if (score >= 3 && password.length >= 10) {
        label = 'ปานกลาง';
      } else if (score >= 2) {
        label = 'อ่อน';
      }

      const tips = [];

      if (!checks[0]) tips.push('เพิ่มความยาวให้ครบอย่างน้อย 10 ตัวอักษร');
      if (!checks[1]) tips.push('เพิ่มตัวอักษรภาษาอังกฤษตัวพิมพ์เล็ก');
      if (!checks[2]) tips.push('เพิ่มตัวอักษรภาษาอังกฤษตัวพิมพ์ใหญ่');
      if (!checks[3]) tips.push('เพิ่มตัวเลข');
      if (!checks[4]) tips.push('เพิ่มสัญลักษณ์พิเศษ เช่น ! @ #');

      return {
        checks: checks,
        score: score,
        label: label,
        valid: checks.every(Boolean),
        tips: tips
      };
    }

    function updatePasswordStrength() {
      const input = $('#new-password');
      if (!input) return;

      const password = input.value;
      const result = clientPasswordStrength(password);
      const meter = $('#password-meter');

      meter.className = 'security-meter ' +
        (result.score >= 4
          ? 'level-strong'
          : result.score >= 3
            ? 'level-medium'
            : '');

      $$('.security-meter span', meter).forEach(function (bar, index) {
        bar.classList.toggle('filled', index < result.score);
      });

      $('#password-strength-label').textContent =
        'ระดับความปลอดภัย: ' +
        (password ? result.label : 'ยังไม่ได้กรอกรหัสผ่าน');

      $('#password-tips').innerHTML = result.tips.length
        ? result.tips.map(tip => '<li>' + esc(tip) + '</li>').join('')
        : '<li class="success-text">ผ่านเงื่อนไขพื้นฐานด้านความปลอดภัยแล้ว</li>';
    }

    function updatePasswordMatch() {
      const input = $('#new-password');
      const confirm = $('#confirm-password');
      const message = $('#password-match-message');

      if (!input || !confirm || !message) return;

      if (!confirm.value) {
        message.textContent = '';
        message.className = 'form-hint';
        return;
      }

      const matched = input.value === confirm.value;

      message.textContent = matched
        ? 'รหัสผ่านตรงกัน'
        : 'รหัสผ่านไม่ตรงกัน';

      message.className = matched
        ? 'small success-text'
        : 'small danger-text';
    }

    async function submitChangePassword(event) {
      event.preventDefault();

      const button = $('#submit-change-password');
      const currentPassword = $('#current-password').value;
      const newPassword = $('#new-password').value;
      const confirmPassword = $('#confirm-password').value;

      if (!currentPassword || !newPassword || !confirmPassword) {
        showToast('กรุณากรอกข้อมูลให้ครบทุกช่อง', 'error');
        return;
      }

      if (newPassword !== confirmPassword) {
        showToast('รหัสผ่านใหม่และการยืนยันไม่ตรงกัน', 'error');
        return;
      }

      const strength = clientPasswordStrength(newPassword);

      if (!strength.valid) {
        showToast('รหัสผ่านยังไม่ผ่านเงื่อนไขความปลอดภัย', 'error');
        return;
      }

      setBusy(button, true, 'กำลังเปลี่ยนรหัสผ่าน');

      try {
        await callPost('changePassword', {
          currentPassword: currentPassword,
          newPassword: newPassword,
          confirmPassword: confirmPassword
        });

        showToast('เปลี่ยนรหัสผ่านเรียบร้อยแล้ว', 'success');

        state.user.mustChangePassword = false;

        try {
          localStorage.setItem(

            JSON.stringify(state.user)
          );
        } catch (error) {
          /* ข้ามการบันทึกข้อมูลที่แคชไว้ */
        }

        renderSecurityPage();
      } catch (error) {
        showToast(error.message, 'error');
      } finally {
        const currentButton = $('#submit-change-password');
        if (currentButton) setBusy(currentButton, false);
      }
    }

        await initializeAppData();
        navigate('dashboard', true);

        showToast('เข้าสู่ระบบสำเร็จ', 'success');

        if (result.mustChangePassword) {
          await sleep(250);

          openModal({
            title: 'แนะนำให้เปลี่ยนรหัสผ่าน',
            body:
              '<div style="display:flex;gap:13px;align-items:flex-start">' +
                '<div class="stat-icon" style="color:#b7791f;background:#fff4df">' +
                  '<i class="fa-solid fa-shield-halved"></i>' +
                '</div>' +
                '<div><strong style="font-size:21px">ตั้งรหัสผ่านที่ปลอดภัย</strong>' +
                  '<p style="margin:5px 0 0;color:var(--muted)">' +
                    'เพื่อความปลอดภัยของบัญชี แนะนำให้เปลี่ยนรหัสผ่านเริ่มต้นของคุณ' +
                  '</p></div>' +
              '</div>',
            footer:
              '<button type="button" class="btn btn-secondary" id="skip-password-change">ภายหลัง</button>' +
              '<button type="button" class="btn btn-primary" id="go-security">เปลี่ยนรหัสผ่าน</button>'
          });

          $('#skip-password-change').addEventListener('click', closeModal);

          $('#go-security').addEventListener('click', function () {
            closeModal();
            navigate('security', true);
          });
        }
      } catch (error) {
        showToast(error.message || 'เข้าสู่ระบบไม่สำเร็จ', 'error');
      } finally {
        setBusy(button, false);
      }
    });

    $('#toggle-login-password').addEventListener('click', function () {
      const input = $('#login-password');
      const icon = $('i', this);
      const showing = input.type === 'text';

      input.type = showing ? 'password' : 'text';

      icon.className = showing
        ? 'fa-regular fa-eye'
        : 'fa-regular fa-eye-slash';
    });

    $('#open-login-help').addEventListener('click', openHelpModal);
    $('#sidebar-logout').addEventListener('click', performLogout);

    $('#mobile-menu-button').addEventListener('click', function () {
      document.body.classList.toggle('sidebar-open');
    });

    $('#sidebar-overlay').addEventListener('click', closeSidebarMobile);

    $('#copy-current-page').addEventListener('click', function () {
      copyText(currentPageUrl(state.route));
    });

    window.addEventListener('hashchange', function () {
      if (!state.user) return;

      const route = getRouteFromHash();

      if (route !== state.route) {
        navigate(route, false);
      }
    });

    window.addEventListener('popstate', function () {
      if (!state.user) return;
      navigate(getRouteFromHash(), false);
    });

    document.addEventListener('visibilitychange', function () {
      if (
        document.visibilityState === 'visible' &&
        state.token &&
        state.user
      ) {
        /*
         * Session จะถูกตรวจสอบจาก API เมื่อมีการทำรายการ
         * ไม่จำเป็นต้องเข้าสู่ระบบใหม่เพียงเพราะกลับมาเปิดแท็บ
         */
      }
    });

    /* =========================================================
       18. STARTUP
       ========================================================= */

    async function bootActiGallery() {
      showStartupLoading(
        'กำลังโหลดข้อมูลการใช้งาน',
        'กำลังตรวจสอบสถานะการเข้าสู่ระบบ'
      );

      const token = getSavedToken();

      if (!token) {
        showLoginScreen();
        return;
      }

      await validateExistingSession();
    }

    document.addEventListener('DOMContentLoaded', function () {
      bootActiGallery().catch(function (error) {
        console.error(error);
        clearSavedToken();
        showLoginScreen();

        showToast(
          error.message || 'ไม่สามารถเริ่มต้นระบบได้',
          'error'
        );
      });
    });
  </script>
</body>
  </html>
