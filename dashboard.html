<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="ActiGallery ระบบจัดการคลังภาพกิจกรรมออนไลน์">
  <title>เข้าสู่ระบบ | ActiGallery</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>
    :root {
      --primary: #2878e8;
      --primary-dark: #155cc2;
      --primary-light: #edf5ff;
      --background: #f6f8fb;
      --surface: #ffffff;
      --text: #243044;
      --muted: #728096;
      --border: #e3e9f1;
      --green: #16834a;
      --red: #dc3545;
      --orange: #bf7611;
      --radius: 12px;
      --shadow: 0 5px 20px rgba(24, 43, 70, .055);
      --sidebar-width: 250px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: "TH Sarabun New", "TH SarabunPSK", "Sarabun", sans-serif;
      font-size: 19px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    img {
      max-width: 100%;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .hidden {
      display: none !important;
    }

    .muted {
      color: var(--muted);
    }

    .small {
      font-size: 16px;
    }

    .danger-text {
      color: var(--red);
    }

    .success-text {
      color: var(--green);
    }

    .wrap-anywhere {
      overflow-wrap: anywhere;
    }

    .btn {
      min-height: 41px;
      padding: 8px 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 1px solid transparent;
      border-radius: 9px;
      font-size: 18px;
      font-weight: 600;
      transition: background .15s ease, border-color .15s ease;
    }

    .btn:active {
      transform: scale(.985);
    }

    .btn-primary {
      color: #ffffff;
      background: var(--primary);
    }

    .btn-primary:hover {
      background: var(--primary-dark);
    }

    .btn-secondary {
      color: #344054;
      background: #ffffff;
      border-color: var(--border);
    }

    .btn-secondary:hover {
      background: #f5f8fc;
    }

    .btn-danger {
      color: #ffffff;
      background: var(--red);
    }

    .btn-danger:hover {
      background: #bd2636;
    }

    .btn-success {
      color: #ffffff;
      background: var(--green);
    }

    .btn-sm {
      min-height: 33px;
      padding: 5px 10px;
      font-size: 16px;
    }

    .btn-icon {
      width: 38px;
      height: 38px;
      flex: 0 0 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      border-radius: 9px;
      color: #526074;
      background: #ffffff;
    }

    .btn-icon:hover {
      color: var(--primary);
      background: var(--primary-light);
    }

    .btn-block {
      width: 100%;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 15px;
      min-width: 0;
    }

    .form-group > label {
      color: #344054;
      font-size: 18px;
      font-weight: 600;
    }

    .form-control {
      width: 100%;
      min-width: 0;
      min-height: 44px;
      padding: 9px 12px;
      border: 1px solid #d8e0eb;
      border-radius: 8px;
      outline: none;
      color: var(--text);
      background: #ffffff;
      transition: border-color .15s ease, box-shadow .15s ease;
    }

    .form-control:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(40, 120, 232, .12);
    }

    .form-control:disabled,
    .form-control[readonly] {
      color: #667085;
      background: #f0f2f5;
      cursor: not-allowed;
    }

    textarea.form-control {
      min-height: 105px;
      resize: vertical;
    }

    .form-hint {
      color: var(--muted);
      font-size: 16px;
    }

    .form-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 13px;
    }

    .field-action {
      display: flex;
      align-items: stretch;
      gap: 7px;
      min-width: 0;
    }

    .field-action .form-control {
      flex: 1;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 2px 0 16px;
      color: #475467;
      font-size: 17px;
    }

    .checkbox-row input {
      width: 17px;
      height: 17px;
      accent-color: var(--primary);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
    }

    .badge-blue {
      color: #1d60ba;
      background: #eaf3ff;
    }

    .badge-green {
      color: #187344;
      background: #e8f8ee;
    }

    .badge-red {
      color: #b42318;
      background: #feecec;
    }

    .badge-gray {
      color: #596679;
      background: #eff2f6;
    }

    .badge-orange {
      color: #975a16;
      background: #fff4df;
    }

    .card {
      min-width: 0;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .card-header {
      min-width: 0;
      padding: 16px 19px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid var(--border);
    }

    .card-body {
      padding: 19px;
    }

    .section-heading {
      margin: 0;
      font-size: 25px;
      font-weight: 700;
      line-height: 1.25;
    }

    .section-description {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 17px;
    }

    .page-heading {
      margin-bottom: 20px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 14px;
    }

    .page-heading h1 {
      margin: 0;
      font-size: 30px;
      line-height: 1.25;
    }

    .page-heading p {
      margin: 4px 0 0;
      color: var(--muted);
    }

    .page-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .toolbar {
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 9px;
    }

    .toolbar .form-control {
      width: auto;
      min-width: 180px;
    }

    .toolbar .search-input {
      flex: 1;
      min-width: 200px;
    }

    .empty-state {
      padding: 38px 20px;
      color: var(--muted);
      text-align: center;
    }

    .empty-state > i {
      display: block;
      margin-bottom: 12px;
      color: #a9b5c5;
      font-size: 31px;
    }

    .empty-state > strong {
      display: block;
      margin-bottom: 4px;
      color: #526074;
      font-size: 20px;
    }

    .table-wrap {
      width: 100%;
      overflow: auto;
    }

    .data-table {
      width: 100%;
      min-width: 570px;
      border-collapse: collapse;
    }

    .data-table th,
    .data-table td {
      padding: 12px 14px;
      border-bottom: 1px solid #edf0f5;
      text-align: left;
      vertical-align: middle;
    }

    .data-table th {
      color: #667085;
      background: #fafbfd;
      font-size: 16px;
      font-weight: 700;
      white-space: nowrap;
    }

    .data-table td {
      font-size: 18px;
    }

    .data-table tbody tr:hover {
      background: #fafcff;
    }

    .table-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    /* Login */

    #login-screen {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: #ffffff;
    }

    .login-topbar {
      padding: 20px 25px;
      border-bottom: 1px solid #edf0f4;
    }

    .login-brand {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 23px;
      font-weight: 700;
    }

    .brand-mark {
      width: 37px;
      height: 37px;
      flex: 0 0 37px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 9px;
      color: #ffffff;
      background: var(--primary);
      font-size: 19px;
    }

    .login-main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 18px;
    }

    .login-box {
      width: 100%;
      max-width: 410px;
    }

    .login-box h1 {
      margin: 0 0 5px;
      font-size: 32px;
    }

    .login-description {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 18px;
    }

    .login-box .form-control {
      min-height: 47px;
    }

    .login-submit {
      width: 100%;
      min-height: 46px;
      margin-top: 3px;
    }

    .help-link {
      display: block;
      margin: 19px auto 0;
      padding: 4px;
      border: 0;
      color: var(--primary);
      background: none;
      font-size: 17px;
      text-align: center;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .login-footer {
      padding: 18px;
      border-top: 1px solid #edf0f4;
      color: #8a94a4;
      font-size: 15px;
      text-align: center;
    }

    /* Loading */

    #startup-loading {
      position: fixed;
      z-index: 8000;
      inset: 0;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text);
      background: rgba(255, 255, 255, .97);
      text-align: center;
    }

    .loading-spinner {
      width: 39px;
      height: 39px;
      margin-bottom: 15px;
      border: 4px solid #e1ebfa;
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Back-office layout */

    #app-screen {
      min-height: 100vh;
      display: flex;
    }

    .sidebar {
      position: fixed;
      z-index: 500;
      inset: 0 auto 0 0;
      width: var(--sidebar-width);
      display: flex;
      flex-direction: column;
      background: #ffffff;
      border-right: 1px solid var(--border);
      transition: transform .2s ease;
    }

    .sidebar-brand {
      min-height: 76px;
      padding: 17px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--border);
    }

    .sidebar-brand-name {
      min-width: 0;
      font-size: 22px;
      font-weight: 700;
      line-height: 1.2;
    }

    .sidebar-brand-sub {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 400;
    }

    .sidebar-menu {
      flex: 1;
      padding: 14px 11px;
      overflow-y: auto;
    }

    .menu-label {
      padding: 11px 11px 7px;
      color: #a1aab8;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: .3px;
      text-transform: uppercase;
    }

    .nav-link {
      width: 100%;
      min-height: 44px;
      margin-bottom: 4px;
      padding: 9px 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      border: 0;
      border-radius: 9px;
      color: #667085;
      background: transparent;
      text-align: left;
      font-size: 18px;
    }

    .nav-link i {
      width: 20px;
      text-align: center;
      font-size: 16px;
    }

    .nav-link:hover {
      color: var(--primary);
      background: #f3f7fd;
    }

    .nav-link.active {
      color: var(--primary);
      background: var(--primary-light);
      font-weight: 700;
    }

    .sidebar-bottom {
      padding: 13px;
      border-top: 1px solid var(--border);
    }

    .sidebar-user {
      min-width: 0;
      padding: 7px;
      margin-bottom: 7px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 40px;
      height: 40px;
      flex: 0 0 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      color: var(--primary);
      background: var(--primary-light);
      font-size: 21px;
    }

    .sidebar-user-info {
      min-width: 0;
    }

    .sidebar-user-info strong,
    .sidebar-user-info span {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .sidebar-user-info strong {
      font-size: 17px;
    }

    .sidebar-user-info span {
      color: var(--muted);
      font-size: 15px;
    }

    .sidebar-logout {
      width: 100%;
      justify-content: flex-start;
      color: #6b7280;
    }

    .main-area {
      flex: 1;
      min-width: 0;
      margin-left: var(--sidebar-width);
    }

    .topbar {
      position: sticky;
      z-index: 300;
      top: 0;
      min-height: 76px;
      padding: 13px 25px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      background: rgba(255,255,255,.97);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(8px);
    }

    .topbar-left,
    .topbar-right {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .topbar-title {
      min-width: 0;
      font-size: 23px;
      font-weight: 700;
    }

    .topbar-user {
      min-width: 0;
      padding-left: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-left: 1px solid var(--border);
    }

    .topbar-user-info {
      min-width: 0;
      text-align: right;
    }

    .topbar-user-info strong,
    .topbar-user-info span {
      display: block;
      max-width: 210px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .topbar-user-info strong {
      font-size: 17px;
    }

    .topbar-user-info span {
      color: var(--muted);
      font-size: 15px;
    }

    .main-content {
      width: 100%;
      max-width: 1700px;
      padding: 25px;
      margin: 0 auto;
    }

    .mobile-menu-button {
      display: none;
    }

    .sidebar-overlay {
      display: none;
      position: fixed;
      z-index: 400;
      inset: 0;
      background: rgba(15, 23, 42, .38);
    }

    /* Dashboard cards */

    .stat-grid {
      margin-bottom: 22px;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 15px;
    }

    .stat-card {
      min-width: 0;
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .stat-icon {
      width: 48px;
      height: 48px;
      flex: 0 0 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      color: var(--primary);
      background: var(--primary-light);
      font-size: 22px;
    }

    .stat-info {
      min-width: 0;
    }

    .stat-label {
      display: block;
      color: var(--muted);
      font-size: 17px;
    }

    .stat-value {
      display: block;
      margin-top: 1px;
      font-size: 30px;
      font-weight: 700;
      line-height: 1.15;
      overflow-wrap: anywhere;
    }

    .stat-subtitle {
      display: block;
      margin-top: 3px;
      color: #98a2b3;
      font-size: 15px;
    }

    /* Albums */

    .album-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 17px;
    }

    .album-card {
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #ffffff;
      transition: box-shadow .15s ease, transform .15s ease;
    }

    .album-card:hover {
      box-shadow: 0 8px 22px rgba(35, 65, 100, .09);
      transform: translateY(-2px);
    }

    .album-cover {
      height: 175px;
      position: relative;
      overflow: hidden;
      background: #edf2f7;
    }

    .album-cover img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .album-cover-placeholder {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #a6b2c2;
      font-size: 36px;
    }

    .album-card-body {
      padding: 14px;
    }

    .album-card-title {
      margin: 0 0 4px;
      font-size: 21px;
      font-weight: 700;
      line-height: 1.3;
      overflow-wrap: anywhere;
    }

    .album-card-meta {
      color: var(--muted);
      font-size: 16px;
      overflow-wrap: anywhere;
    }

    .album-card-actions {
      margin-top: 13px;
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    /* Image editor */

    .editor-image-grid {
      margin-top: 13px;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 11px;
    }

    .editor-photo {
      position: relative;
      min-width: 0;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      border: 2px solid transparent;
      border-radius: 10px;
      background: #eef2f7;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      touch-action: pan-y;
    }

    .editor-photo img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      pointer-events: none;
    }

    .editor-photo.selected {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(40,120,232,.1);
    }

    .editor-photo.dragging {
      opacity: .45;
      border-color: var(--primary);
    }

    .photo-select-dot {
      position: absolute;
      z-index: 3;
      top: 7px;
      right: 7px;
      width: 25px;
      height: 25px;
      display: none;
      align-items: center;
      justify-content: center;
      border: 2px solid #ffffff;
      border-radius: 50%;
      color: transparent;
      background: rgba(255,255,255,.86);
      box-shadow: 0 1px 5px rgba(0,0,0,.15);
    }

    .selection-mode .photo-select-dot {
      display: flex;
    }

    .editor-photo.selected .photo-select-dot {
      color: #ffffff;
      background: var(--primary);
      border-color: var(--primary);
    }

    .photo-order {
      position: absolute;
      top: 7px;
      left: 7px;
      padding: 2px 7px;
      border-radius: 5px;
      color: #ffffff;
      background: rgba(15,23,42,.65);
      font-size: 14px;
      pointer-events: none;
    }

    .photo-pending-label {
      position: absolute;
      right: 5px;
      bottom: 5px;
      left: 5px;
      padding: 3px 5px;
      overflow: hidden;
      border-radius: 5px;
      color: #ffffff;
      background: rgba(21,128,61,.9);
      font-size: 14px;
      text-overflow: ellipsis;
      white-space: nowrap;
      pointer-events: none;
    }

    .floating-photo-toolbar {
      position: sticky;
      z-index: 50;
      bottom: 12px;
      width: max-content;
      max-width: 100%;
      margin: 18px auto 0;
      padding: 9px;
      display: flex;
      justify-content: center;
      gap: 9px;
      border: 1px solid #dce5f0;
      border-radius: 13px;
      background: rgba(255,255,255,.97);
      box-shadow: 0 10px 30px rgba(15,23,42,.16);
    }

    .upload-dropzone {
      position: relative;
      min-height: 120px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 1.5px dashed #b9c9df;
      border-radius: 11px;
      color: #65748a;
      background: #f9fbff;
      text-align: center;
      cursor: pointer;
    }

    .upload-dropzone:hover {
      border-color: var(--primary);
      background: #f0f6ff;
    }

    .upload-dropzone > i {
      color: var(--primary);
      font-size: 28px;
    }

    .upload-dropzone input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .progress-wrap {
      padding: 13px;
      margin-top: 13px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: #f8fafc;
    }

    .progress-header {
      margin-bottom: 7px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 17px;
    }

    .progress-track {
      width: 100%;
      height: 9px;
      overflow: hidden;
      border-radius: 20px;
      background: #e7edf5;
    }

    .progress-bar {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: var(--primary);
      transition: width .15s ease;
    }

    .progress-bar.complete {
      background: var(--green);
    }

    /* Security */

    .security-meter {
      margin: 7px 0;
      display: flex;
      gap: 4px;
    }

    .security-meter span {
      height: 6px;
      flex: 1;
      border-radius: 5px;
      background: #e5e7eb;
    }

    .security-meter span.filled {
      background: #dc2626;
    }

    .security-meter.level-medium span.filled {
      background: #e7a329;
    }

    .security-meter.level-strong span.filled {
      background: #16a34a;
    }

    .security-tips {
      margin: 7px 0 0;
      padding-left: 20px;
      color: var(--muted);
      font-size: 16px;
    }

    /* Center modal */

    #modal-root {
      position: relative;
      z-index: 10000;
    }

    .modal-backdrop {
      position: fixed;
      z-index: 10000;
      inset: 0;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(17,24,39,.55);
      backdrop-filter: blur(3px);
    }

    .modal-dialog {
      width: 100%;
      max-width: 560px;
      max-height: min(90vh, 900px);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(255,255,255,.7);
      border-radius: 14px;
      color: var(--text);
      background: #ffffff;
      box-shadow: 0 24px 80px rgba(0,0,0,.22);
      animation: modal-enter .16s ease-out;
    }

    .modal-dialog.modal-wide {
      max-width: 920px;
    }

    .modal-dialog.modal-image-viewer {
      max-width: 1100px;
      color: #ffffff;
      background: #101828;
      border-color: #101828;
    }

    @keyframes modal-enter {
      from { opacity: 0; transform: translateY(9px) scale(.99); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .modal-header {
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid var(--border);
    }

    .modal-header h2 {
      margin: 0;
      font-size: 24px;
      font-weight: 700;
    }

    .modal-close {
      width: 35px;
      height: 35px;
      border: 0;
      border-radius: 8px;
      color: #667085;
      background: #f2f4f7;
      font-size: 17px;
    }

    .modal-close:hover {
      color: #111827;
      background: #e9edf3;
    }

    .modal-body {
      padding: 20px;
      overflow-y: auto;
    }

    .modal-footer {
      padding: 13px 20px;
      display: flex;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 8px;
      border-top: 1px solid var(--border);
      background: #fbfcfe;
    }

    .modal-image-stage {
      min-height: 250px;
      max-height: 72vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #101828;
    }

    .modal-image-stage img {
      max-width: 100%;
      max-height: 72vh;
      display: block;
      object-fit: contain;
    }

    /* Toast */

    #toast-container {
      position: fixed;
      z-index: 12000;
      top: 18px;
      right: 18px;
      width: min(390px, calc(100vw - 36px));
      display: flex;
      flex-direction: column;
      gap: 9px;
      pointer-events: none;
    }

    .toast {
      padding: 13px 15px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #ffffff;
      box-shadow: 0 8px 30px rgba(15,23,42,.13);
      pointer-events: auto;
      animation: toast-enter .18s ease-out;
    }

    .toast > i {
      margin-top: 4px;
    }

    .toast.success > i { color: var(--green); }
    .toast.error > i { color: var(--red); }
    .toast.info > i { color: var(--primary); }

    .toast-text {
      flex: 1;
      overflow-wrap: anywhere;
    }

    @keyframes toast-enter {
      from { opacity: 0; transform: translateX(8px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .contact-list {
      margin-top: 17px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px;
    }

    .contact-button {
      min-height: 46px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      border: 1px solid var(--border);
      border-radius: 9px;
      color: #344054;
      background: #ffffff;
      font-size: 18px;
      font-weight: 600;
    }

    .contact-button:hover {
      background: #f8fafc;
      border-color: #c9d5e6;
    }

    .organization-logo {
      width: 45px;
      height: 45px;
      object-fit: contain;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: #ffffff;
    }

    .logo-preview {
      width: 90px;
      height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 1px dashed #c8d2e0;
      border-radius: 10px;
      color: #9aa6b7;
      background: #f9fbfd;
    }

    .logo-preview img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .pagination {
      padding: 13px 17px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      border-top: 1px solid var(--border);
    }

    .modal-note {
      padding: 12px;
      border-radius: 8px;
      color: #53657c;
      background: #f4f7fb;
      font-size: 17px;
    }

    .inline-alert {
      padding: 10px 12px;
      margin-bottom: 14px;
      border: 1px solid #f4d7a1;
      border-radius: 8px;
      color: #8a5a13;
      background: #fff9e9;
    }

    .profile-section {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .profile-section .avatar {
      width: 46px;
      height: 46px;
      flex-basis: 46px;
      font-size: 23px;
    }

    @media (max-width: 1200px) {
      .stat-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .album-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .main-content {
        padding: 20px;
      }
    }

    @media (max-width: 820px) {
      .sidebar {
        transform: translateX(-105%);
      }

      body.sidebar-open .sidebar {
        transform: translateX(0);
      }

      body.sidebar-open .sidebar-overlay {
        display: block;
      }

      .main-area {
        margin-left: 0;
      }

      .mobile-menu-button {
        display: inline-flex;
      }

      .topbar {
        min-height: 66px;
        padding: 12px 15px;
      }

      .topbar-title {
        font-size: 21px;
      }

      .topbar-user-info {
        display: none;
      }

      .topbar-user {
        padding-left: 0;
        border-left: 0;
      }

      .main-content {
        padding: 17px;
      }

      .editor-image-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 580px) {
      body {
        font-size: 18px;
      }

      .stat-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .stat-card {
        padding: 14px;
        gap: 10px;
      }

      .stat-icon {
        width: 39px;
        height: 39px;
        flex-basis: 39px;
        font-size: 18px;
      }

      .stat-value {
        font-size: 25px;
      }

      .stat-label {
        font-size: 16px;
      }

      .album-grid {
        grid-template-columns: minmax(0, 1fr);
      }

      .album-cover {
        height: 190px;
      }

      .form-row {
        grid-template-columns: minmax(0, 1fr);
        gap: 0;
      }

      .page-heading h1 {
        font-size: 26px;
      }

      .page-heading {
        align-items: stretch;
      }

      .page-actions {
        width: 100%;
      }

      .page-actions .btn {
        flex: 1;
      }

      .toolbar {
        align-items: stretch;
      }

      .toolbar .form-control,
      .toolbar .search-input {
        width: 100%;
        min-width: 0;
      }

      .editor-image-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      .modal-backdrop {
        padding: 10px;
      }

      .modal-dialog {
        max-height: 94vh;
        border-radius: 12px;
      }

      .modal-header {
        padding: 13px 15px;
      }

      .modal-body {
        padding: 15px;
      }

      .modal-footer {
        padding: 11px 15px;
      }

      .contact-list {
        grid-template-columns: minmax(0, 1fr);
      }

      .login-topbar {
        padding: 16px;
      }

      .login-main {
        align-items: flex-start;
        padding-top: 58px;
      }

      .login-box h1 {
        font-size: 29px;
      }

      .floating-photo-toolbar {
        width: 100%;
        gap: 5px;
        padding: 7px;
      }

      .floating-photo-toolbar .btn {
        flex: 1;
        padding: 7px 10px;
        font-size: 16px;
      }

      .data-table {
        min-width: 520px;
      }

      .topbar-right > #copy-current-page {
        width: 38px;
        padding: 0;
      }

      .copy-page-label {
        display: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <!-- หน้าล็อกอิน -->
  <section id="login-screen">
    <header class="login-topbar">
      <div class="login-brand">
        <span class="brand-mark"><i class="fa-solid fa-images"></i></span>
        <span>ActiGallery</span>
      </div>
    </header>

    <main class="login-main">
      <div class="login-box">
        <h1>เข้าสู่ระบบ</h1>
        <p class="login-description">ระบบจัดการคลังภาพกิจกรรมออนไลน์</p>

        <form id="login-form" autocomplete="on">
          <div class="form-group">
            <label for="login-username">ชื่อผู้ใช้</label>
            <input
              class="form-control"
              id="login-username"
              name="username"
              type="text"
              autocomplete="username"
              required
              maxlength="100"
              placeholder="กรอกชื่อผู้ใช้"
            >
          </div>

          <div class="form-group">
            <label for="login-password">รหัสผ่าน</label>
            <div class="field-action">
              <input
                class="form-control"
                id="login-password"
                name="password"
                type="password"
                autocomplete="current-password"
                required
                placeholder="กรอกรหัสผ่าน"
              >
              <button
                class="btn-icon"
                type="button"
                id="toggle-login-password"
                aria-label="แสดงหรือซ่อนรหัสผ่าน"
                title="แสดงหรือซ่อนรหัสผ่าน"
              >
                <i class="fa-regular fa-eye"></i>
              </button>
            </div>
          </div>

          <label class="checkbox-row">
            <input id="remember-me" type="checkbox">
            <span>จดจำการเข้าสู่ระบบ</span>
          </label>

          <button class="btn btn-primary login-submit" type="submit" id="login-submit">
            <i class="fa-solid fa-right-to-bracket"></i>
            <span>เข้าสู่ระบบ</span>
          </button>
        </form>

        <button type="button" class="help-link" id="open-login-help">
          ฉันจะทราบชื่อผู้ใช้และรหัสผ่านได้อย่างไร
        </button>
      </div>
    </main>

    <footer class="login-footer">
      ActiGallery · ระบบคลังภาพกิจกรรมออนไลน์
    </footer>
  </section>

  <!-- ตรวจสอบ Session ก่อนเปิดหน้าแอป -->
  <div id="startup-loading" class="hidden" role="status" aria-live="polite">
    <div class="loading-spinner"></div>
    <strong id="startup-loading-title">กำลังโหลดข้อมูลการใช้งาน</strong>
    <div
      id="startup-loading-subtitle"
      class="muted small"
      style="margin-top:6px"
    >
      กำลังตรวจสอบสถานะการเข้าสู่ระบบ
    </div>
  </div>

  <!-- ระบบหลังบ้าน -->
  <div id="app-screen" class="hidden">
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <span class="brand-mark"><i class="fa-solid fa-images"></i></span>
        <div class="sidebar-brand-name">
          ActiGallery
          <span class="sidebar-brand-sub">คลังภาพกิจกรรมออนไลน์</span>
        </div>
      </div>

      <nav id="sidebar-menu" class="sidebar-menu" aria-label="เมนูหลัก"></nav>

      <div class="sidebar-bottom">
        <div class="sidebar-user">
          <div class="avatar"><i class="fa-solid fa-user"></i></div>
          <div class="sidebar-user-info">
            <strong id="sidebar-user-name">ผู้ใช้งาน</strong>
            <span id="sidebar-user-org">หน่วยงาน</span>
          </div>
        </div>

        <button class="btn sidebar-logout" id="sidebar-logout" type="button">
          <i class="fa-solid fa-arrow-right-from-bracket"></i>
          ออกจากระบบ
        </button>
      </div>
    </aside>

    <div class="main-area">
      <header class="topbar">
        <div class="topbar-left">
          <button
            class="btn-icon mobile-menu-button"
            id="mobile-menu-button"
            type="button"
            aria-label="เปิดเมนู"
          >
            <i class="fa-solid fa-bars"></i>
          </button>
          <div class="topbar-title" id="topbar-title">แดชบอร์ด</div>
        </div>

        <div class="topbar-right">
          <button
            class="btn btn-secondary btn-sm"
            type="button"
            id="copy-current-page"
            title="คัดลอกลิงก์หน้านี้"
          >
            <i class="fa-regular fa-copy"></i>
            <span class="copy-page-label">คัดลอกลิงก์หน้านี้</span>
          </button>

          <div class="topbar-user">
            <div class="topbar-user-info">
              <strong id="topbar-user-name">ผู้ใช้งาน</strong>
              <span id="topbar-user-org">หน่วยงาน</span>
            </div>
            <div class="avatar"><i class="fa-solid fa-user"></i></div>
          </div>
        </div>
      </header>

      <main class="main-content" id="main-content"></main>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="toast-container" aria-live="polite" aria-atomic="false"></div>

  <script>
    'use strict';

    /* =========================================================
       1. CONFIGURATION
       ========================================================= */

    const CONFIG = Object.freeze({
      API_URL: 'https://script.google.com/macros/s/AKfycbwbTJBCd8ROe0yrAGBVz7PXuIHCoUB4DI5F-Nhljzy38RG7Dzw6fDIFZNO430E7_HdPjw/exec',
      HOME_URL: 'https://anonmsg.online/',
      SESSION_STORAGE_KEY: 'actigallery_session_token',
      REMEMBER_STORAGE_KEY: 'actigallery_remember_token',
      USER_CACHE_KEY: 'actigallery_user_cache',
      REQUEST_POLL_INTERVAL_MS: 650,
      REQUEST_MAX_POLLS: 55,
      MAX_IMAGE_BYTES: 18 * 1024 * 1024,
      MAX_BATCH_FILES: 500,
      PAGE_SIZE: 50
    });

    const state = {
      token: '',
      user: null,
      route: 'dashboard',
      organizations: [],
      categories: [],
      albums: [],
      users: [],
      logs: [],
      logOffset: 0,
      logTotal: 0,
      logFilter: '',
      albumSearch: '',
      userSearch: '',
      organizationSearch: '',
      categorySearch: '',
      editor: null
    };

    const PAGE_TITLES = {
      dashboard: 'แดชบอร์ด',
      users: 'จัดการผู้ใช้งาน',
      organizations: 'จัดการหน่วยงานและองค์กร',
      albums: 'จัดการอัลบั้ม',
      categories: 'จัดการหมวดหมู่',
      security: 'ความปลอดภัย',
      logs: 'ประวัติการใช้งาน'
    };

    const ROLE_LABELS = {
      admin: 'ผู้ดูแลระบบ',
      album_manager: 'ผู้จัดการอัลบั้ม'
    };

    /* =========================================================
       2. GENERAL UTILITIES
       ========================================================= */

    const $ = (selector, root) =>
      (root || document).querySelector(selector);

    const $$ = (selector, root) =>
      Array.from((root || document).querySelectorAll(selector));

    function esc(value) {
      return String(value === undefined || value === null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    function isAdmin() {
      return Boolean(state.user && state.user.role === 'admin');
    }

    function isAlbumManager() {
      return Boolean(state.user && state.user.role === 'album_manager');
    }

    function formatDate(value, includeTime) {
      if (!value) return '—';

      const date = new Date(value);

      if (Number.isNaN(date.getTime())) {
        return String(value);
      }

      const options = {
        day: '2-digit',
        month: 'short',
        year: 'numeric'
      };

      if (includeTime) {
        options.hour = '2-digit';
        options.minute = '2-digit';
      }

      return new Intl.DateTimeFormat('th-TH', options).format(date);
    }

    function formatNumber(value) {
      return new Intl.NumberFormat('th-TH').format(Number(value || 0));
    }

    function makeRandomHex(bytes) {
      const data = new Uint8Array(bytes || 24);

      if (window.crypto && window.crypto.getRandomValues) {
        window.crypto.getRandomValues(data);
      } else {
        for (let i = 0; i < data.length; i++) {
          data[i] = Math.floor(Math.random() * 256);
        }
      }

      return Array.from(data)
        .map(byte => byte.toString(16).padStart(2, '0'))
        .join('');
    }

    /*
     * ชื่อผู้ใช้และรหัสผ่านในหน้าสร้างบัญชีจะเป็นตัวอย่างระหว่างกรอก
     * ค่าที่ใช้จริงจะเป็น credentials ซึ่งเซิร์ฟเวอร์ส่งกลับหลังสร้างบัญชี
     */
    function makeTemporaryUsername() {
      const data = new Uint32Array(1);

      if (window.crypto && window.crypto.getRandomValues) {
        window.crypto.getRandomValues(data);
      } else {
        data[0] = Math.floor(Math.random() * 4294967295);
      }

      return 'AGL' + String(data[0] % 1000000).padStart(6, '0');
    }

    function makeTemporaryPassword() {
      const randomValue = Math.floor(Math.random() * 10000000);
      return 'GF' + String(randomValue).padStart(7, '0');
    }

    function roleBadge(role) {
      if (role === 'admin') {
        return '<span class="badge badge-blue"><i class="fa-solid fa-shield-halved"></i> ผู้ดูแลระบบ</span>';
      }

      return '<span class="badge badge-gray"><i class="fa-solid fa-images"></i> ผู้จัดการอัลบั้ม</span>';
    }

    function statusBadge(active) {
      return active
        ? '<span class="badge badge-green">เปิดใช้งาน</span>'
        : '<span class="badge badge-red">ปิดใช้งาน</span>';
    }

    function publishedBadge(value) {
      return value
        ? '<span class="badge badge-green">เผยแพร่</span>'
        : '<span class="badge badge-orange">ฉบับร่าง</span>';
    }

    function getRouteFromHash() {
      const raw = window.location.hash.replace(/^#/, '').trim();
      const route = raw.split('?')[0];

      return PAGE_TITLES[route] ? route : 'dashboard';
    }

    function setBusy(button, busy, busyText) {
      if (!button) return;

      if (busy) {
        if (!button.dataset.originalHtml) {
          button.dataset.originalHtml = button.innerHTML;
        }

        button.disabled = true;
        button.innerHTML =
          '<i class="fa-solid fa-spinner fa-spin"></i> ' +
          esc(busyText || 'กำลังดำเนินการ');
      } else {
        button.disabled = false;

        if (button.dataset.originalHtml) {
          button.innerHTML = button.dataset.originalHtml;
          delete button.dataset.originalHtml;
        }
      }
    }

    function showStartupLoading(title, subtitle) {
      $('#startup-loading-title').textContent =
        title || 'กำลังโหลดข้อมูลการใช้งาน';

      $('#startup-loading-subtitle').textContent =
        subtitle || 'กำลังตรวจสอบสถานะการเข้าสู่ระบบ';

      $('#startup-loading').classList.remove('hidden');
    }

    function hideStartupLoading() {
      $('#startup-loading').classList.add('hidden');
    }

    function showToast(message, type) {
      const container = $('#toast-container');
      const toast = document.createElement('div');

      toast.className = 'toast ' + (
        type === 'error'
          ? 'error'
          : type === 'success'
            ? 'success'
            : 'info'
      );

      const icon = type === 'error'
        ? 'fa-circle-exclamation'
        : type === 'success'
          ? 'fa-circle-check'
          : 'fa-circle-info';

      toast.innerHTML =
        '<i class="fa-solid ' + icon + '"></i>' +
        '<div class="toast-text">' + esc(message) + '</div>' +
        '<button type="button" class="btn-icon toast-close" aria-label="ปิดข้อความ">' +
          '<i class="fa-solid fa-xmark"></i>' +
        '</button>';

      $('.toast-close', toast).addEventListener('click', function () {
        toast.remove();
      });

      container.appendChild(toast);

      setTimeout(function () {
        if (toast.isConnected) toast.remove();
      }, 4500);
    }

    async function copyText(text) {
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
        } else {
          const textarea = document.createElement('textarea');

          textarea.value = text;
          textarea.style.position = 'fixed';
          textarea.style.opacity = '0';

          document.body.appendChild(textarea);
          textarea.focus();
          textarea.select();

          const success = document.execCommand('copy');
          textarea.remove();

          if (!success) {
            throw new Error('ไม่สามารถคัดลอกได้');
          }
        }

        showToast('คัดลอกเรียบร้อยแล้ว', 'success');
      } catch (error) {
        showToast(
          'ไม่สามารถคัดลอกได้ กรุณาคัดลอกลิงก์ด้วยตนเอง',
          'error'
        );
      }
    }

    /* =========================================================
       3. API COMMUNICATION
       ========================================================= */

    /*
     * GET อ่านข้อมูลผ่าน JSONP เพื่อให้ทำงานจาก GitHub Pages
     * โดยไม่ต้องอ่าน Response ข้าม Origin โดยตรง
     */
    function apiGet(params) {
      return new Promise(function (resolve, reject) {
        const callbackName = '__actigallery_jsonp_' + makeRandomHex(8);
        const query = new URLSearchParams();

        Object.keys(params || {}).forEach(function (key) {
          const value = params[key];

          if (value === undefined || value === null) return;

          query.set(
            key,
            typeof value === 'object'
              ? JSON.stringify(value)
              : String(value)
          );
        });

        query.set('callback', callbackName);

        const script = document.createElement('script');
        let finished = false;
        let timeout = null;

        function cleanup() {
          if (finished) return;

          finished = true;
          clearTimeout(timeout);

          try {
            delete window[callbackName];
          } catch (error) {
            window[callbackName] = undefined;
          }

          script.remove();
        }

        timeout = setTimeout(function () {
          cleanup();
          reject(new Error('หมดเวลารอ API กรุณาตรวจสอบการเชื่อมต่อ'));
        }, 25000);

        window[callbackName] = function (result) {
          cleanup();
          resolve(result);
        };

        script.onerror = function () {
          cleanup();
          reject(new Error('ไม่สามารถเชื่อมต่อ API ได้'));
        };

        script.async = true;
        script.src = CONFIG.API_URL + '?' + query.toString();
        document.head.appendChild(script);
      });
    }

    /*
     * POST ส่งการทำรายการไปยัง Code.gs
     * และอ่านผลลัพธ์กลับผ่าน action=apiResult
     * ตามรูปแบบ Request Cache ของ Code.gs ที่ใช้อยู่
     */
    async function apiPost(params) {
      const requestId = makeRandomHex(20);
      const requestSecret = makeRandomHex(32);

      const payload = Object.assign({}, params, {
        requestId: requestId,
        requestSecret: requestSecret
      });

      let postError = null;

      try {
        await fetch(CONFIG.API_URL, {
          method: 'POST',
          mode: 'no-cors',
          redirect: 'follow',
          headers: {
            'Content-Type': 'text/plain;charset=UTF-8'
          },
          body: JSON.stringify(payload)
        });
      } catch (error) {
        postError = error;
      }

      for (
        let attempt = 0;
        attempt < CONFIG.REQUEST_MAX_POLLS;
        attempt++
      ) {
        try {
          const result = await apiGet({
            action: 'apiResult',
            requestId: requestId,
            requestSecret: requestSecret
          });

          if (result && result.pending) {
            await sleep(CONFIG.REQUEST_POLL_INTERVAL_MS);
            continue;
          }

          if (result && result.success === false) {
            throw new Error(
              result.message || 'ทำรายการไม่สำเร็จ'
            );
          }

          if (result && result.success === true) {
            return result;
          }

          if (result && typeof result === 'object') {
            return result;
          }

          await sleep(CONFIG.REQUEST_POLL_INTERVAL_MS);
        } catch (error) {
          if (
            error &&
            error.message &&
            error.message.indexOf('หมดเวลารอ API') === -1
          ) {
            throw error;
          }

          await sleep(CONFIG.REQUEST_POLL_INTERVAL_MS);
        }
      }

      if (postError) {
        throw new Error(
          'ส่งข้อมูลไม่สำเร็จ กรุณาตรวจสอบอินเทอร์เน็ตและลองใหม่'
        );
      }

      throw new Error(
        'ไม่ได้รับผลลัพธ์จากเซิร์ฟเวอร์ภายในเวลาที่กำหนด'
      );
    }

    async function callGet(action, params) {
      const result = await apiGet(
        Object.assign({}, params || {}, {
          action: action
        })
      );

      if (!result || result.success !== true) {
        throw new Error(
          result && result.message
            ? result.message
            : 'ไม่สามารถโหลดข้อมูลได้'
        );
      }

      return result;
    }

    async function callPost(action, params) {
      const result = await apiPost(
        Object.assign({}, params || {}, {
          action: action,
          token: state.token
        })
      );

      if (!result || result.success !== true) {
        throw new Error(
          result && result.message
            ? result.message
            : 'ทำรายการไม่สำเร็จ'
        );
      }

      return result;
    }

    /* =========================================================
       4. LOGIN, SESSION AND LOGOUT
       ========================================================= */

    function getSavedToken() {
      try {
        const remembered = localStorage.getItem(
          CONFIG.REMEMBER_STORAGE_KEY
        );

        if (remembered) return remembered;

        const temporary = sessionStorage.getItem(
          CONFIG.SESSION_STORAGE_KEY
        );

        if (temporary) return temporary;
      } catch (error) {
        console.warn('Browser storage is unavailable.');
      }

      return '';
    }

    function saveToken(token, rememberMe) {
      clearSavedToken();

      state.token = token;

      try {
        if (rememberMe) {
          localStorage.setItem(
            CONFIG.REMEMBER_STORAGE_KEY,
            token
          );
        } else {
          sessionStorage.setItem(
            CONFIG.SESSION_STORAGE_KEY,
            token
          );
        }
      } catch (error) {
        showToast(
          'เบราว์เซอร์ไม่อนุญาตให้จดจำการเข้าสู่ระบบ',
          'error'
        );
      }
    }

    function clearSavedToken() {
      try {
        localStorage.removeItem(CONFIG.REMEMBER_STORAGE_KEY);
        sessionStorage.removeItem(CONFIG.SESSION_STORAGE_KEY);
        localStorage.removeItem(CONFIG.USER_CACHE_KEY);
      } catch (error) {
        /* เบราว์เซอร์อาจปิดการใช้งาน Storage */
      }

      state.token = '';
      state.user = null;
    }

    async function login(username, password, rememberMe) {
      const result = await apiPost({
        action: 'login',
        username: username,
        password: password,
        rememberMe: rememberMe,
        userAgent: navigator.userAgent
      });

      if (!result || result.success !== true || !result.token) {
        throw new Error(
          result && result.message
            ? result.message
            : 'เข้าสู่ระบบไม่สำเร็จ'
        );
      }

      saveToken(result.token, rememberMe);
      state.user = result.user;

      try {
        localStorage.setItem(
          CONFIG.USER_CACHE_KEY,
          JSON.stringify(result.user)
        );
      } catch (error) {
        /* ไม่จำเป็นต้องบันทึกข้อมูลที่แคชไว้ */
      }

      return result;
    }

    async function validateExistingSession() {
      const token = getSavedToken();

      if (!token) {
        showLoginScreen();
        return;
      }

      state.token = token;

      try {
        const result = await callGet('me', {
          token: token
        });

        state.user = result.user;

        try {
          localStorage.setItem(
            CONFIG.USER_CACHE_KEY,
            JSON.stringify(result.user)
          );
        } catch (error) {
          /* ไม่จำเป็นต้องบันทึกข้อมูลที่แคชไว้ */
        }

        showAppScreen();
        await initializeAppData();
        navigate(getRouteFromHash(), false);
      } catch (error) {
        clearSavedToken();
        showLoginScreen();

        if (window.location.hash) {
          history.replaceState(
            null,
            '',
            window.location.pathname + window.location.search
          );
        }
      } finally {
        hideStartupLoading();
      }
    }

    function showLoginScreen() {
      $('#login-screen').classList.remove('hidden');
      $('#app-screen').classList.add('hidden');
      hideStartupLoading();
    }

    function showAppScreen() {
      $('#login-screen').classList.add('hidden');

    function renderUserProfile() {
      if (!state.user) return;

      $('#topbar-user-org').textContent = organization;

    async function performLogout() {
      const accepted = await askConfirm(
        'ออกจากระบบ',

        'ออกจากระบบ',

      if (!accepted) return;

      try {

          await callPost('logout', {});

      const title = options.title || '';

      $('#modal-root').innerHTML =
        '<div class="modal-backdrop" data-modal-backdrop>' +

            '" role="dialog" aria-modal="true" aria-label="' + esc(title) + '">' +
            '<header class="modal-header">' +
              '<h2>' + esc(title) + '</h2>' +
              '<button class="modal-close" type="button" data-modal-close aria-label="ปิด">' +
                '<i class="fa-solid fa-xmark"></i>' +
              '</button>' +
            '</header>' +
            '<div class="modal-body">' + (options.body || '') + '</div>' +
            (options.footer
              ? '<footer class="modal-footer">' + options.footer + '</footer>'
              : '') +
          '</section>' +
        '</div>';

      const root = $('#modal-root');

      $('[data-modal-close]', root).addEventListener(
        'click',
        closeModal
      );

      backdrop.addEventListener('click', function (event) {
        if (event.target === backdrop) {
          closeModal();
        }
      });

      document.addEventListener('keydown', modalEscapeHandler);

      const firstInput = $(
        'input, button, select, textarea',
        $('.modal-dialog', root)
      );

      if (firstInput) {
        setTimeout(function () {
          try {
            firstInput.focus();
          } catch (error) {
            /* ข้ามกรณีที่ Focus ไม่สำเร็จ */
          }
        }, 20);
      }
    }

    function modalEscapeHandler(event) {
      if (event.key === 'Escape') closeModal();
    }

    function closeModal() {
      $('#modal-root').innerHTML = '';
      document.removeEventListener('keydown', modalEscapeHandler);
    }

    function askConfirm(title, message, confirmText, confirmClass) {
      return new Promise(function (resolve) {
        let completed = false;

        function finish(value) {
          if (completed) return;

          completed = true;
          closeModal();
          resolve(value);
        }

        openModal({
          title: title,
          body:
            '<div style="display:flex;align-items:flex-start;gap:13px">' +
              '<div style="width:43px;height:43px;flex:0 0 43px;border-radius:11px;background:#fff2e8;color:#d97706;display:flex;align-items:center;justify-content:center;font-size:21px">' +

              '</div>' +
            '</div>',
          footer:
            '<button type="button" class="btn btn-secondary" id="confirm-cancel">ยกเลิก</button>' +
            '<button type="button" class="btn ' +
              (confirmClass || 'btn-danger') +
              '" id="confirm-yes">' +
              esc(confirmText || 'ยืนยัน') +
            '</button>'
        });

        $('#confirm-cancel').addEventListener(
          'click',
          () => finish(false)
        );

        $('#confirm-yes').addEventListener(
          'click',
          () => finish(true)
        );
      });
    }

    function navigate(route, updateHash) {
      if (!PAGE_TITLES[route]) route = 'dashboard';

      if (!state.user) {
        showLoginScreen();
        return;
      }

      if (
        !isAdmin() &&
        ['users', 'organizations', 'categories'].includes(route)
      ) {
        route = 'dashboard';
      }

      state.route = route;

      if (updateHash !== false) {
        const hash = '#' + route;

        if (window.location.hash !== hash) {
          history.pushState(
            { route: route },
            '',
            window.location.pathname + window.location.search + hash
          );
        }
      }

      $('#topbar-title').textContent = PAGE_TITLES[route];

      $$('[data-route]', $('#sidebar-menu')).forEach(function (button) {
        button.classList.toggle(
          'active',
          button.dataset.route === route
        );
      });

      closeSidebarMobile();
      renderRoute();
    }

    async function initializeAppData() {
      if (!state.user) return;

      if (isAdmin()) {
        await Promise.allSettled([
          loadOrganizations(),
          loadCategories()
        ]);
      }

    async function loadOrganizations() {
      const result = await callGet('listOrganizations', {
        token: state.token
      });

      state.organizations = result.organizations || [];
      return state.organizations;
    }

    async function loadCategories() {
      const result = await callGet('listCategories', {
        token: state.token
      });

      state.categories = result.categories || [];
      return state.categories;
    }

    async function loadAlbums() {
      const result = await callGet('listAlbums', {
        token: state.token,
        includeDeleted: false
      });

      state.albums = result.albums || [];
      return state.albums;

    async function loadUsers() {
      const result = await callGet('listUsers', {
        token: state.token
      });

      state.users = result.users || [];
      return state.users;
    }

    async function loadLogs(offset) {
      const result = await callGet('listLogs', {
        token: state.token,
        limit: CONFIG.PAGE_SIZE,
        offset: Math.max(0, Number(offset || 0)),
        actionFilter: state.logFilter || ''
      });

      state.logs = result.logs || [];
      state.logTotal = Number(result.total || 0);
      state.logOffset = Number(result.offset || 0);
      return state.logs;
    }

      const organizations = state.organizations.filter(function (item) {

      }

      return (
        '<option value="">เลือกหน่วยงานหรือองค์กร</option>' +
        organizations.map(function (organization) {
          return (
            '<option value="' + esc(organization.organizationId) + '"' +
              (String(organization.organizationId) === String(selectedId)
                ? ' selected'
                : '') +

          );
        }).join('')
      );
    }

    async function submitCreateUser() {
      const button = $('#submit-create-user');
      const fullName = $('#new-user-fullname').value.trim();
      const organizationId = $('#new-user-organization').value;

      if (!fullName) {
        showToast('กรุณากรอกชื่อ-สกุล', 'error');
        $('#new-user-fullname').focus();
        return;
      }

      if (!organizationId) {
        showToast('กรุณาเลือกหน่วยงานหรือองค์กร', 'error');
        $('#new-user-organization').focus();
        return;
      }

      setBusy(button, true, 'กำลังสร้างผู้ใช้งาน');

      try {
        const result = await callPost('createUser', {
          fullName: fullName,
          organizationId: organizationId
        });

        showCreatedCredentials(
          result.credentials.username,
          result.credentials.password,
          result.user
        );
      } catch (error) {
        showToast(error.message, 'error');
      } finally {
        const current = $('#submit-create-user');
        if (current) setBusy(current, false);
      }
    }

    function showCreatedCredentials(username, password, user) {
      closeModal();

      openModal({
        title: 'สร้างผู้ใช้งานเรียบร้อยแล้ว',

    function bindLogoPicker() {
      let selectedFile = null;
      let previewObjectUrl = '';

      const fileInput = $('#organization-logo-file');
      const dropzone = $('#organization-logo-dropzone');
      const preview = $('#organization-logo-preview');

      dropzone.addEventListener('click', function () {
        fileInput.click();
      });

      dropzone.addEventListener('keydown', function (event) {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          fileInput.click();
        }
      });

      fileInput.addEventListener('change', function () {
        const file = fileInput.files && fileInput.files[0];
        if (!file) return;

        if (!file.type.startsWith('image/')) {
          showToast('กรุณาเลือกไฟล์รูปภาพ', 'error');
          fileInput.value = '';
          return;
        }

        if (file.size > CONFIG.MAX_IMAGE_BYTES) {
          showToast('ไฟล์โลโก้มีขนาดใหญ่เกินไป', 'error');
          fileInput.value = '';
          return;
        }

        selectedFile = file;

        if (previewObjectUrl) {
          URL.revokeObjectURL(previewObjectUrl);
        }

        previewObjectUrl = URL.createObjectURL(file);

        preview.innerHTML =
          '<img src="' + esc(previewObjectUrl) + '" alt="ตัวอย่างโลโก้">';

        const oldName = $('[data-logo-name]', dropzone);
        if (oldName) oldName.remove();

        dropzone.insertAdjacentHTML(
          'beforeend',
          '<span data-logo-name class="small">' + esc(file.name) + '</span>'
        );
      });

      return {
        getFile: () => selectedFile,
        cleanup: () => {
          if (previewObjectUrl) URL.revokeObjectURL(previewObjectUrl);
        }
      };
    }

    async function saveOrganization(organizationId) {
      const button = $('#save-organization');
      const name = $('#organization-name').value.trim();
      const active = $('#organization-active').checked;

      if (!name) {
        showToast('กรุณากรอกชื่อหน่วยงานหรือองค์กร', 'error');
        return;
      }

      const picker = window.actiGalleryLogoPicker;
      setBusy(button, true, 'กำลังบันทึก');

      try {
        let logoUrl = '';

        if (organizationId) {
          const current = state.organizations.find(item =>
            String(item.organizationId) === String(organizationId)
          );

          logoUrl = current ? current.logoUrl || '' : '';

          if (picker && picker.getFile()) {
            logoUrl = await uploadImageFile(picker.getFile());
          }

          await callPost('updateOrganization', {
            organizationId: organizationId,
            name: name,
            logoUrl: logoUrl,
            isActive: active
          });
        } else {
          if (picker && picker.getFile()) {
            logoUrl = await uploadImageFile(picker.getFile());
          }

          const result = await callPost('createOrganization', {
            name: name,
            logoUrl: logoUrl
          });

          if (!active && result.organization) {
            await callPost('updateOrganization', {
              organizationId: result.organization.organizationId,
              isActive: false
            });
          }
        }

        if (picker) picker.cleanup();

        closeModal();
        await loadOrganizations();
        await renderOrganizationsPage();

        showToast(
          organizationId
            ? 'แก้ไขหน่วยงานเรียบร้อยแล้ว'
            : 'เพิ่มหน่วยงานเรียบร้อยแล้ว',
          'success'
        );
      } catch (error) {
        showToast(error.message, 'error');
      } finally {
        const current = $('#save-organization');
        if (current) setBusy(current, false);
      }
    }

    function renderCategoriesTable() {

      );

      if (!categories.length) {

            '<div>เพิ่มหมวดหมู่เพื่อให้ผู้จัดการเลือกใช้ในอัลบั้ม</div>' +

      }

      area.innerHTML =
        '<div class="table-wrap">' +
          '<table class="data-table">' +
            '<thead><tr><th>ชื่อหมวดหมู่</th><th>รายละเอียด</th><th>สถานะ</th><th>จัดการ</th></tr></thead>' +

                      esc(category.description || 'ไม่มีข้อมูลรายละเอียด') +

                    ) + '</td>' +

                        '<i class="fa-solid fa-trash"></i></button>' +

    function openCategoryModal(categoryId) {
      const category = categoryId
        ? state.categories.find(item =>
            String(item.categoryId) === String(categoryId)
          )
        : null;

      if (categoryId && !category) {
        showToast('ไม่พบหมวดหมู่', 'error');
        return;
      }

      openModal({
        title: category ? 'แก้ไขหมวดหมู่' : 'เพิ่มหมวดหมู่',
        body:
          '<form id="category-form">' +
            '<div class="form-group">' +
              '<label for="category-name">ชื่อหมวดหมู่ <span class="danger-text">*</span></label>' +
              '<input class="form-control" id="category-name" maxlength="200" required value="' +
                esc(category ? category.name : '') +
                '" placeholder="เช่น กิจกรรมกีฬา">' +
            '</div>' +
            '<div class="form-group">' +
              '<label for="category-description">รายละเอียดหมวดหมู่</label>' +
              '<textarea class="form-control" id="category-description" maxlength="10000" placeholder="รายละเอียดเพิ่มเติม (ไม่บังคับ)">' +
                esc(category ? category.description : '') +
              '</textarea>' +
            '</div>' +
            (category
              ? '<label class="checkbox-row" style="margin:0 0 10px"><input id="category-active" type="checkbox" ' +
                  (category.isActive ? 'checked' : '') +
                  '><span>เปิดใช้งานหมวดหมู่</span></label>'
              : '') +
          '</form>',
        footer:
          '<button type="button" class="btn btn-secondary" id="cancel-category">ยกเลิก</button>' +
          '<button type="button" class="btn btn-primary" id="save-category">' +
            '<i class="fa-solid fa-floppy-disk"></i> บันทึก' +
          '</button>'
      });

      $('#cancel-category').addEventListener('click', closeModal);

      $('#save-category').addEventListener('click', async function () {
        const button = this;
        const name = $('#category-name').value.trim();
        const description = $('#category-description').value.trim();

        if (!name) {
          showToast('กรุณากรอกชื่อหมวดหมู่', 'error');
          return;
        }

        setBusy(button, true, 'กำลังบันทึก');

        try {
          if (category) {
            await callPost('updateCategory', {
              categoryId: category.categoryId,
              name: name,
              description: description,
              isActive: $('#category-active').checked
            });
          } else {
            await callPost('createCategory', {
              name: name,
              description: description
            });
          }

          closeModal();
          await loadCategories();
          await renderCategoriesPage();

          showToast(
            category
              ? 'แก้ไขหมวดหมู่เรียบร้อยแล้ว'
              : 'เพิ่มหมวดหมู่เรียบร้อยแล้ว',
            'success'
          );
        } catch (error) {
          showToast(error.message, 'error');
        } finally {
          const current = $('#save-category');
          if (current) setBusy(current, false);
        }
      });
    }

    async function deleteCategory(categoryId) {
      const category = state.categories.find(item =>
        String(item.categoryId) === String(categoryId)
      );

      if (!category) return;

      const accepted = await askConfirm(
        'ลบหมวดหมู่',
        'ต้องการลบหมวดหมู่ "' + category.name + '" ใช่หรือไม่',
        'ลบหมวดหมู่',
        'btn-danger'
      );

      if (!accepted) return;

      try {
        await callPost('deleteCategory', {
          categoryId: category.categoryId
        });

        await loadCategories();
        await renderCategoriesPage();

        showToast('ลบหมวดหมู่เรียบร้อยแล้ว', 'success');
      } catch (error) {
        showToast(error.message, 'error');
      }
    }

    function renderAlbumsGrid() {
      const area = $('#albums-grid-area');
      if (!area) return;

      const query = String(state.albumSearch || '').trim().toLowerCase();

      const albums = state.albums.filter(album =>
        [
          album.title,
          album.description,
          album.organizationName,
          album.categoryName
        ].some(value =>
          String(value || '').toLowerCase().includes(query)
        )
      );

      $('#album-count').textContent =
        formatNumber(albums.length) + ' อัลบั้ม';

      if (!albums.length) {
        area.innerHTML =
          '<div class="empty-state">' +
            '<i class="fa-regular fa-images"></i>' +
            '<strong>ยังไม่มีอัลบั้ม</strong>' +
            '<div>สร้างอัลบั้มแรกเพื่อรวบรวมภาพกิจกรรมของคุณ</div>' +
            '<button class="btn btn-primary" type="button" id="create-first-album" style="margin-top:13px">' +
              '<i class="fa-solid fa-plus"></i> สร้างอัลบั้ม' +
            '</button>' +
          '</div>';

        $('#create-first-album').addEventListener(
          'click',
          () => openAlbumEditor(null)
        );

        return;
      }

      area.innerHTML =
        '<div class="album-grid">' +
          albums.map(renderAlbumCard).join('') +
        '</div>';

      bindAlbumCardActions();
    }

    function bindAlbumCardActions() {
      $$('[data-edit-album]').forEach(button => {
        button.addEventListener('click', function () {
          openAlbumEditor(button.dataset.editAlbum);
        });
      });

      $$('[data-share-album]').forEach(button => {
        button.addEventListener('click', function () {
          const album = state.albums.find(item =>
            String(item.albumId) === String(button.dataset.shareAlbum)
          );

          if (album) shareAlbum(album);
        });
      });

      $$('[data-copy-album]').forEach(button => {
        button.addEventListener('click', function () {
          const album = state.albums.find(item =>
            String(item.albumId) === String(button.dataset.copyAlbum)
          );

          if (album) copyText(getAlbumShareUrl(album));
        });
      });

      $$('[data-delete-album]').forEach(button => {
        button.addEventListener('click', function () {
          deleteAlbum(button.dataset.deleteAlbum);
        });
      });
    }

    function getAlbumShareUrl(album) {
      const id = typeof album === 'string'
        ? album
        : album.albumId;

      return CONFIG.HOME_URL.replace(/\/+$/, '') +
        '/?album=' + encodeURIComponent(String(id));
    }

    async function shareAlbum(album) {
      const url = getAlbumShareUrl(album);

      if (navigator.share) {
        try {
          await navigator.share({
            title: album.title || 'ActiGallery',
            text: 'ชมภาพกิจกรรม ' + (album.title || ''),
            url: url
          });
          return;
        } catch (error) {
          if (error && error.name === 'AbortError') return;
        }
      }

      copyText(url);
    }

    async function deleteAlbum(albumId) {
      const album = state.albums.find(item =>
        String(item.albumId) === String(albumId)
      );

      if (!album) {
        showToast('ไม่พบอัลบั้มที่ต้องการลบ', 'error');
        return;
      }

      const accepted = await askConfirm(
        'ลบอัลบั้ม',
        'ต้องการลบอัลบั้ม "' + album.title +
          '" พร้อมรูปภาพในอัลบั้มนี้ใช่หรือไม่',
        'ลบอัลบั้ม',
        'btn-danger'
      );

      if (!accepted) return;

      try {
        await callPost('deleteAlbum', {
          albumId: album.albumId
        });

        await loadAlbums();
        renderAlbumsGrid();

        showToast('ลบอัลบั้มเรียบร้อยแล้ว', 'success');
      } catch (error) {
        showToast(error.message, 'error');
      }
    }

    /* =========================================================
       13. ALBUM EDITOR
       ========================================================= */

    async function openAlbumEditor(albumId) {
      let album = null;
      let photos = [];

      try {
        if (isAdmin()) {
          await Promise.all([
            loadOrganizations(),
            loadCategories()
          ]);
        } else {
          await loadCategories();
        }

        if (albumId) {
          const result = await callGet('getAlbum', {
            token: state.token,
            albumId: albumId
          });

          album = result.album;

          photos = (result.photos || []).map(photo => Object.assign({}, photo, {
            clientId: makeRandomHex(8),
            pendingFile: null,
            previewUrl: photo.imageUrl,
            isNew: false
          }));
        }
      } catch (error) {
        showToast(error.message, 'error');
        return;
      }

      if (!album) {
        album = {
          albumId: '',
          title: '',
          description: '',
          organizationId: isAdmin() ? '' : state.user.organizationId,
          categoryId: '',
          coverUrl: '',
          isPublished: true
        };
      }

      state.editor = {
        albumId: album.albumId || '',
        originalAlbum: album,
        photos: photos,
        objectUrls: [],
        selectionMode: false,
        selectedPhotoIds: new Set(),
        draggedPhotoKey: '',
        isSaving: false
      };

      openModal({
        title: album.albumId ? 'แก้ไขอัลบั้ม' : 'สร้างอัลบั้มใหม่',
        wide: true,
        body: buildAlbumEditorBody(album),
        footer:
          '<button type="button" class="btn btn-secondary" id="cancel-album-editor">ยกเลิก</button>' +
          '<button type="button" class="btn btn-primary" id="save-album-editor">' +
            '<i class="fa-solid fa-cloud-arrow-up"></i> ' +
            (album.albumId ? 'บันทึกการแก้ไข' : 'อัปโหลดอัลบั้ม') +
          '</button>'
      });

      bindAlbumEditorEvents();
      renderEditorPhotos();
      updateCategoryDetails();
    }

    function buildCategoryOptions(selectedId) {
      const categories = state.categories.filter(item =>
        item.isActive && !item.isDeleted
      );

      return (
        '<option value="">ไม่ระบุหมวดหมู่</option>' +
        categories.map(function (category) {
          const selected =
            String(category.categoryId) === String(selectedId)
              ? ' selected'
              : '';

          const suffix = category.description
            ? ' — ' + category.description
            : ' — ไม่มีข้อมูลรายละเอียด';

          return (
            '<option value="' + esc(category.categoryId) + '"' +
              selected + '>' +
              esc(category.name + suffix) +
            '</option>'
          );
        }).join('')
      );
    }
